<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India - Watch Shows Online, Watch Movies Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <div class="overlay"></div>
        <nav>
            <img src="assets/images/logo.svg" class="logo">
            <div class="nav-options">
                <select class="language">
                    <option value="english" selected>English</option>
                    <option value="hindi">हिन्दी</option>
                </select>
                <button class="sign-in">Sign In</button>
            </div>
        </nav>
        <article>
            <h1>
                <span>Unlimited movies,</span>
                <span>shows, and more</span>
            </h1>
            <h4>Starts at ₹149. Cancel at any time.</h4>
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
            <div class="user-input">
                <input type="text" placeholder="Email Address" id="email-address-input">
                <button>Get Started</button>
            </div>
        </article>
    </header>
    <div class="separation"></div>
</body>
</html>
